# DeepShell 外置配置
# 此文件与 deepshell.jar 同级，启动时自动加载并覆盖程序内置默认值；未列出的项保持内置默认。
# 完整的内置默认配置可在 jar 内的 BOOT-INF/classes/application.yml 查看。

deepshell:
  # 程序数据目录：数据库、加密密钥、AI 配置、局域网开关、日志、背景图等均存放于此。
  # 相对路径基于启动目录解析；默认指向程序目录下的 data/，拷贝该目录即可迁移全部数据。
  data-dir: ./data

  # 登录认证（默认关闭，仅本机使用）。开启局域网访问时必须启用登录并修改默认密码。
  # Token 默认 6 小时有效，持续使用会自动续期；有效期可在右上角菜单「登录与安全」中修改。
  auth:
    enabled: false
    username: admin
    password: deepshell
    token-expire-hours: 6
    # 同一 IP 连续登录失败达到该次数后，后续登录必须输入图形验证码；0 表示关闭
    captcha-fail-times: 2

  # TLS/HTTPS：auto = 局域网访问时自动启用；on = 始终启用；off = 关闭（由反向代理终止 TLS）
  tls:
    mode: auto
    # 留空使用数据目录 tls/deepshell.p12 自签证书（首次启动自动生成，浏览器需信任）
    keystore: ""
    keystore-password: ""
    keystore-type: PKCS12
    key-alias: deepshell
    key-password: ""

